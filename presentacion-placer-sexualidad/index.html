<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Placer, decisiones personales y sexualidad</title>
<style>
:root{--bg:#0b0d24;--ink:#f1f1fa;--mut:#a9aed0;--a:#8b7bff;--b:#ff7ab8;--c:#4fd1c5;--card:rgba(255,255,255,.07)}
*{box-sizing:border-box;margin:0}html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font:clamp(15px,1.7vw,22px)/1.5 system-ui,"Segoe UI",sans-serif}
#bg{position:fixed;inset:0;z-index:0}
.glow{position:fixed;inset:-20%;z-index:0;background:radial-gradient(40% 40% at 20% 30%,#4b3fd455,transparent),radial-gradient(35% 35% at 80% 70%,#ff4f9a40,transparent);animation:drift 18s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(4%,-3%) scale(1.1)}}
.slide{position:fixed;inset:0;z-index:1;display:none;flex-direction:column;justify-content:center;padding:6vh 8vw;gap:2vh;view-transition-name:slide}
.slide.on{display:flex}
h1,h2{font-weight:800;letter-spacing:-.02em;line-height:1.1}h1{font-size:clamp(34px,6vw,80px)}h2{font-size:clamp(26px,4vw,52px);background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
.w{display:inline-block;opacity:0;transform:translateY(.6em);animation:wd .6s forwards}@keyframes wd{to{opacity:1;transform:none}}
.who{color:var(--c);font-size:.7em;letter-spacing:.08em;text-transform:uppercase}
p,li{max-width:62ch;color:#dfe0f5}ul{padding-left:1.1em}
.q{font-size:1.25em;max-width:46ch;border-left:4px solid var(--b);padding-left:1em}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.card{background:var(--card);border:1px solid #ffffff22;border-radius:18px;padding:18px;backdrop-filter:blur(8px);transition:transform .15s,box-shadow .3s;transform-style:preserve-3d;cursor:pointer;font:inherit;color:inherit;text-align:left}
.card:hover{box-shadow:0 18px 40px #0008}.card b{color:var(--a)}.card.act{outline:2px solid var(--b)}
.card .more{max-height:0;overflow:hidden;opacity:0;transition:.4s;color:var(--mut)}.card.act .more{max-height:200px;opacity:1;margin-top:.5em}
.bar{height:26px;border-radius:8px;background:linear-gradient(90deg,var(--a),var(--b));transition:width .5s;min-width:3px}
.row{display:flex;align-items:center;gap:10px;margin:6px 0}.row span{width:2.2em}
button.btn{background:var(--a);border:0;color:#fff;padding:.5em 1em;border-radius:999px;font:inherit;cursor:pointer}
.step{opacity:.25;transition:.4s}.step.lit{opacity:1;color:var(--c);transform:translateX(8px)}
#hud{position:fixed;z-index:5;right:14px;top:10px;display:flex;gap:10px;font-size:.6em;color:var(--mut)}
#hud span{background:#0007;border-radius:99px;padding:3px 10px}#hud .late{color:#ffb454}
#prog{position:fixed;z-index:5;left:0;top:0;height:3px;background:linear-gradient(90deg,var(--a),var(--b));transition:width .4s}
#notes{position:fixed;z-index:6;left:0;right:0;bottom:0;background:#05061aee;border-top:1px solid #fff3;padding:14px 8vw;font-size:.7em;transform:translateY(105%);transition:.35s;max-height:42vh;overflow:auto}
#notes.show{transform:none}
#grid{position:fixed;inset:0;z-index:7;background:#05061af0;display:none;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;padding:5vh 5vw;overflow:auto;font-size:.7em}
#grid.show{display:grid}#grid button{background:var(--card);color:inherit;border:1px solid #fff3;border-radius:12px;padding:14px;cursor:pointer;font:inherit}
#help{font-size:.55em;color:var(--mut);position:fixed;bottom:8px;left:14px;z-index:5}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.w{opacity:1;transform:none}}
::view-transition-old(slide){animation:.4s ease both fo}::view-transition-new(slide){animation:.5s ease both fi}
@keyframes fo{to{opacity:0;transform:scale(.96)}}@keyframes fi{from{opacity:0;transform:scale(1.04)}}
</style></head><body>
<canvas id="bg"></canvas><div class="glow"></div><div id="prog"></div>
<div id="hud"><span id="tm">00:00</span><span id="bd"></span><span id="ct"></span><span id="mt" style="cursor:pointer">🔊</span></div>
<main id="deck"></main>
<div id="notes"></div><div id="grid"></div>
<div id="help">← → navegar · 1-9 saltar · G índice · N notas · T reiniciar reloj · M sonido · F pantalla completa · C confeti</div>
<script>
const $=(s,r=document)=>r.querySelector(s);
const S=[
{t:"Placer, decisiones personales y sexualidad",who:"Yeimi · 2 min",min:2,k:"cover",x:"Conocimiento del cuerpo, límites y bienestar<br><small>Yeimi Melendez Pikitini · Yomali · Gamboa — Preparatoria Madero</small><br><br><b>Escanea el QR de Mentimeter y escribe UNA palabra: ¿qué piensas al oír «sexualidad»?</b>",n:"Abrir nube de palabras 20 s. Guardar captura para comparar en la slide 12. Regla de convivencia: se puede dudar y discrepar; no se puede burlar ni juzgar."},
{t:"¿Quién decide sobre tu cuerpo?",who:"Yeimi · 2 min",min:2,x:"<p class='q'>¿Hasta qué punto conocer nuestro cuerpo y aprender a poner límites influye en nuestra seguridad, autoestima y bienestar, y nos permite ejercer la autonomía con responsabilidad ante la presión social?</p>",n:"Desarmar la pregunta en tres ideas: conocimiento, límites, autonomía. Kant: darse uno mismo la ley. Nadie es autónomo sobre lo que desconoce. Mano alzada: ¿quién aprendió primero de un video o amigo?"},
{t:"Conceptos clave",who:"Yeimi y Yomali · 6 min",min:6,k:"wheel",n:"Placer: dimensión del bienestar según OMS, requiere consentimiento. Decisiones y privacidad: arts. 4 y 16 constitucionales. Autonomía sin responsabilidad es egoísmo; responsabilidad sin autonomía es obediencia. Yomali: mitos (virginidad, placer femenino, «los hombres no pueden parar») y regla de 3 preguntas: ¿quién lo dice?, ¿qué evidencia?, ¿qué gana?"},
{t:"¿Por qué importa?",who:"Yeimi · 3 min",min:3,k:"cards",items:[["Vida cotidiana","Menos ansiedad ante los cambios, autoimagen sana."],["Relaciones","Comunicación asertiva y consentimiento entusiasta."],["Sociedad","Menos violencia, embarazos no planeados e ITS."],["Derechos","Autonomía corporal, privacidad, información."]],x:"<p class='q'>Lo íntimo también es político.</p>",n:"Cuatro círculos de lo cercano a lo amplio. Escala 1-5: ¿qué tan seguro/a te sientes de decir no? Comentar tendencia sin señalar a nadie."},
{t:"¿Qué dice la evidencia?",who:"Yomali · 4 min",min:4,k:"cards",items:[["UNESCO + OMS y otros (2018)","Revisión de programas: la educación sexual integral no adelanta el inicio sexual y mejora el uso de protección."],["Kirby (2007) y Haberland (2015)","Programas con enfoque de género y poder: 5 veces más eficaces."],["UNFPA (2021)","≈45% de mujeres en 57 países no decide libremente sobre su salud y sexualidad."]],n:"Método → hallazgo → por qué importa hoy. Verificar cifras con los originales antes de exponer. Cierre: la información protege, el silencio expone, la desigualdad condiciona."},
{t:"Problema y situación social",who:"Yomali · 3 min",min:3,k:"cards",items:[["Estereotipos","Guiones rígidos de masculinidad y feminidad."],["Discriminación","Hostigamiento a la diversidad sexo-genérica."],["Presión social","«Si me quisieras lo harías».","Disfrazada de broma, amor o curiosidad."],["Desigualdad","Asimetrías de edad, dinero, género."],["Falta de información","La pornografía comercial llena el vacío."],["Mitos","El amor exige pruebas; el cuerpo no es propiedad."]],x:"<p class='q'>No es un problema de individuos: es un problema de sistema.</p>",n:"Los seis factores se retroalimentan. Encuesta anónima: ¿qué presión has visto más cerca?"},
{t:"Análisis crítico",who:"Yomali · Yeimi · Gamboa · 3 min",min:3,k:"cards",items:[["1 · Problema raíz","Tabuización y vacío educativo: el silencio no protege, expone."],["2 · Factores","Socioculturales (machismo), psicológicos (culpa), institucionales (sin ESI)."],["3 · Qué hacer","Educación integral laica y basada en evidencia; diálogo sin juicios; servicios amigables."]],n:"Un minuto por pregunta. Padlet: «Una acción concreta para nuestra escuela», 1 minuto."},
{t:"Prevención y alternativas",who:"Gamboa · 3 min",min:3,k:"ladder",n:"Consentimiento dinámico: libre, informado, entusiasta, específico, reversible. Frases: «No me siento listo/a», «Me gustaría ir más despacio», «Gracias por preguntar, hoy no». Redes de apoyo confidenciales y Ley Olimpia. Mostrar QR del directorio de ayuda."},
{t:"Reflexión profunda",who:"Yeimi · 2 min",min:2,x:"<p class='q'>Si el placer y la sexualidad son dimensiones naturales del ser humano, ¿por qué la sociedad insiste en gestionarlos desde el miedo, la culpa y el silencio, y no desde la responsabilidad, el conocimiento y el respeto a la dignidad?</p><p>Pausa de 10 segundos. Silencio.</p>",n:"No juzgar a familias ni maestros: lo aprendido fue una herencia, no una verdad absoluta. La pregunta es qué hago yo con lo que recibí."},
{t:"Trascendencia futura",who:"Gamboa · 2 min",min:2,k:"cards",items:[["Hoy 15-18","Autoconocimiento"],["Universidad / trabajo","Límites claros"],["Pareja y familia","Relaciones igualitarias"],["Ciudadanía","Participación y derechos"]],n:"El bienestar sexual es parte del proyecto de vida. Escala Slido 1-5 sobre importancia de poner límites; puente a la actividad."},
{t:"El dilema de Sofía y Carlos",who:"Gamboa · 11 min",min:11,k:"vote",x:"<p>Sofía (16) y Carlos (17) llevan 4 meses. Carlos dice que «si de verdad lo ama, debe demostrarlo» y esa noche le pide una foto íntima «como prueba de confianza». Sofía duda y teme que él la deje o la ridiculice.</p>",n:"0:00 caso · 1:30 voto inicial · 3:00 equipos azul (presión), verde (mito romántico), naranja (frases asertivas), morado (foto íntima y Ley Olimpia) · 6:00 plenaria · 9:00 voto final · 10:00 cierre. Si alguien comparte violencia: escuchar, no exponer, canalizar a orientación."},
{t:"Conclusión",who:"Gamboa · 2 min",min:2,k:"close",x:"<ol><li>El placer y la sexualidad son dimensiones legítimas del bienestar integral.</li><li>La autonomía y el consentimiento son innegociables.</li><li>La información científica es protección.</li></ol><p class='q'>¿Qué debería cambiar en mi manera de pensar y de actuar después de conocer este tema?</p>",n:"Repetir la nube de palabras de la slide 1 y comparar. Yomali: educar no adelanta nada. Yeimi: nadie es libre de elegir lo que ignora."},
{t:"Fuentes",who:"Equipo · 1 min",min:1,x:"<ul style='font-size:.7em'><li>UNESCO et al. (2018). Orientaciones técnicas internacionales sobre educación en sexualidad.</li><li>UNFPA (2021). Estado de la población mundial: Mi cuerpo me pertenece.</li><li>OMS (2006). Defining sexual health.</li><li>Kirby, D. (2007). Emerging Answers 2007.</li><li>Haberland, N. (2015). Int. Perspectives on Sexual and Reproductive Health, 41(1).</li><li>WAS (2014). Declaración de los Derechos Sexuales.</li><li>CPEUM arts. 4 y 16; LGDNNA. INEGI/ENADID (verificar título).</li></ul>",n:"Gracias. Atender preguntas."}
];
const WHEEL=[["Placer","Dimensión del bienestar físico, emocional y social."],["Decisiones","Elecciones sobre mi cuerpo y proyecto de vida."],["Privacidad","Mi intimidad no se invade ni se exhibe."],["Autonomía","Decidir con información y sin coerción."],["Responsabilidad","Cuidar mi salud y la de la otra persona."],["Mitos","Creencias sin evidencia que limitan derechos."],["Información","Educación basada en evidencia."]];
const LAD=["Libre","Informado","Entusiasta","Específico","Reversible"];
const OPT=["A) Decir que sí para no perder la relación","B) Decir que no y mantener el límite","C) Pedir tiempo y hablar con Carlos","D) Pedir ayuda a un adulto de confianza"];
let cur=0,t0=Date.now(),muted=false,AC,amb;const votes={ini:[0,0,0,0],fin:[0,0,0,0]};let phase="ini";
/* audio sintetizado (sin archivos) */
function ac(){return AC||(AC=new(window.AudioContext||window.webkitAudioContext)())}
function tone(f,d=.25,ty="sine",v=.08,at=0){if(muted)return;const c=ac(),o=c.createOscillator(),g=c.createGain();o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(v,c.currentTime+at);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+at+d);o.connect(g).connect(c.destination);o.start(c.currentTime+at);o.stop(c.currentTime+at+d)}
function whoosh(){if(muted)return;const c=ac(),b=c.createBuffer(1,c.sampleRate*.4,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);const s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();s.buffer=b;f.type="bandpass";f.frequency.setValueAtTime(400,c.currentTime);f.frequency.exponentialRampToValueAtTime(3000,c.currentTime+.35);g.gain.value=.05;s.connect(f).connect(g).connect(c.destination);s.start()}
const chime=()=>[523,659,784,1047].forEach((f,i)=>tone(f,.5,"triangle",.07,i*.1));
function ambient(){if(amb||muted)return;const c=ac();amb=[110,165,220].map((f,i)=>{const o=c.createOscillator(),g=c.createGain();o.frequency.value=f;o.type="sine";g.gain.value=.012;o.connect(g).connect(c.destination);o.start();return o})}
function setMute(m){muted=m;$("#mt").textContent=m?"🔇":"🔊";if(m&&amb){amb.forEach(o=>o.stop());amb=null}else if(!m)ambient()}
/* render */
const deck=$("#deck");
S.forEach((s,i)=>{const e=document.createElement("section");e.className="slide";let h=`<div class="who">${s.who}</div><${i?"h2":"h1"}>${s.t.split(" ").map((w,j)=>`<span class="w" style="animation-delay:${j*.07}s">${w}</span>`).join(" ")}</${i?"h2":"h1"}>`;
if(s.x)h+=`<div>${s.x}</div>`;
if(s.k=="cards")h+=`<div class="grid">${s.items.map(c=>`<button class="card"><b>${c[0]}</b><div>${c[1]}</div>${c[2]?`<div class="more">${c[2]}</div>`:""}</button>`).join("")}</div>`;
if(s.k=="wheel")h+=`<div class="grid">${WHEEL.map(c=>`<button class="card"><b>${c[0]}</b><div class="more">${c[1]}</div></button>`).join("")}</div><p class="q">Autonomía sin responsabilidad es egoísmo; responsabilidad sin autonomía es obediencia.</p>`;
if(s.k=="ladder")h+=`<p>Haz clic en cada peldaño: el consentimiento es un proceso, no una firma.</p><div id="lad">${LAD.map(c=>`<div class="card step">${c}</div>`).join("")}</div>`;
if(s.k=="vote")h+=`<div><button class="btn" id="ph">Fase: voto inicial (clic para cambiar)</button> <small>Toca una opción por cada voto de la sala.</small><div id="opts">${OPT.map((o,j)=>`<div class="row"><button class="card" data-o="${j}" style="flex:0 0 55%">${o}</button><div class="bar" id="b${j}" style="width:3px"></div><span id="n${j}">0</span></div>`).join("")}</div></div>`;
if(s.k=="close")h+=`<button class="btn" onclick="confetti()" style="align-self:flex-start">🎉 Cierre</button>`;
e.innerHTML=h;deck.appendChild(e)});
const sl=[...document.querySelectorAll(".slide")];
function go(i,snd=true){i=Math.max(0,Math.min(S.length-1,i));const f=()=>{sl[cur].classList.remove("on");cur=i;sl[cur].classList.add("on");sl[cur].querySelectorAll(".w").forEach(w=>{w.style.animation="none";void w.offsetWidth;w.style.animation=""});upd()};
document.startViewTransition?document.startViewTransition(f):f();if(snd)whoosh();ambient();if(i==S.length-2||S[i].k=="close")setTimeout(confetti,600)}
function upd(){$("#prog").style.width=(cur+1)/S.length*100+"%";$("#ct").textContent=`${cur+1}/${S.length}`;$("#notes").innerHTML=`<b>${S[cur].t}</b> — ${S[cur].who}<br>${S[cur].n}`;
const plan=S.slice(0,cur).reduce((a,s)=>a+s.min,0);$("#bd").textContent=`plan ${plan}:00 · slide ${S[cur].min} min`}
setInterval(()=>{const s=Math.floor((Date.now()-t0)/1000),plan=S.slice(0,cur+1).reduce((a,s)=>a+s.min,0)*60;$("#tm").textContent=String(s/60|0).padStart(2,"0")+":"+String(s%60).padStart(2,"0");$("#tm").className=s>plan+60?"late":""},1000);
/* interacciones */
document.addEventListener("click",e=>{const c=e.target.closest(".card");if(c&&!c.dataset.o&&!c.classList.contains("step")){c.classList.toggle("act");tone(660,.15,"triangle")}
if(c&&c.classList.contains("step")){c.classList.add("lit");tone(440+120*[...c.parentNode.children].indexOf(c),.3,"triangle");if(!$$(".step:not(.lit)").length){chime();confetti()}}
if(c&&c.dataset.o!==undefined){votes[phase][c.dataset.o]++;tone(520,.1);draw()}
if(e.target.id=="ph"){phase=phase=="ini"?"fin":"ini";e.target.textContent=phase=="ini"?"Fase: voto inicial (clic para cambiar)":"Fase: voto FINAL (clic para cambiar)";draw();if(phase=="fin")chime()}
if(e.target.id=="mt")setMute(!muted)});
const $$=s=>[...document.querySelectorAll(s)];
function draw(){const v=votes[phase],m=Math.max(1,...v);v.forEach((n,j)=>{$("#b"+j).style.width=Math.max(3,n/m*35)+"vw";$("#n"+j).textContent=n})}
/* tilt 3D */
document.addEventListener("mousemove",e=>{const c=e.target.closest&&e.target.closest(".card");if(c){const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;c.style.transform=`perspective(600px) rotateY(${x*12}deg) rotateX(${-y*12}deg)`}});
document.addEventListener("mouseout",e=>{const c=e.target.closest&&e.target.closest(".card");if(c)c.style.transform=""});
/* teclado */
document.addEventListener("keydown",e=>{const k=e.key.toLowerCase();if(["arrowright"," ","pagedown"].includes(k))go(cur+1);else if(["arrowleft","pageup"].includes(k))go(cur-1);else if(k=="home")go(0);else if(k=="end")go(S.length-1);else if(/^[1-9]$/.test(k))go(+k-1);
else if(k=="n")$("#notes").classList.toggle("show");else if(k=="g"||k=="escape")$("#grid").classList.toggle("show",k=="g"&&!$("#grid").classList.contains("show"));
else if(k=="t")t0=Date.now();else if(k=="m")setMute(!muted);else if(k=="c")confetti();else if(k=="f")document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()});
$("#grid").innerHTML=S.map((s,i)=>`<button data-i="${i}">${i+1}. ${s.t}<br><small>${s.who}</small></button>`).join("");
$("#grid").onclick=e=>{const b=e.target.closest("button");if(b){$("#grid").classList.remove("show");go(+b.dataset.i)}};
let x0;document.addEventListener("touchstart",e=>x0=e.touches[0].clientX);document.addEventListener("touchend",e=>{const d=e.changedTouches[0].clientX-x0;if(Math.abs(d)>60)go(cur+(d<0?1:-1))});
/* partículas + confeti */
const cv=$("#bg"),cx=cv.getContext("2d");let W,H,P=[],M={x:-1e3,y:-1e3},CF=[];
function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight}rs();addEventListener("resize",rs);
for(let i=0;i<70;i++)P.push({x:Math.random()*W,y:Math.random()*H,vx:Math.random()-.5,vy:Math.random()-.5});
addEventListener("mousemove",e=>{M.x=e.clientX;M.y=e.clientY});
function confetti(){chime();for(let i=0;i<140;i++)CF.push({x:W/2,y:H*.6,vx:(Math.random()-.5)*16,vy:-Math.random()*16-4,c:`hsl(${Math.random()*360},90%,65%)`,l:140})}
(function loop(){cx.clearRect(0,0,W,H);const rm=matchMedia("(prefers-reduced-motion:reduce)").matches;
P.forEach(p=>{if(!rm){const dx=M.x-p.x,dy=M.y-p.y,d=Math.hypot(dx,dy);if(d<160){p.vx+=dx/d*.02;p.vy+=dy/d*.02}p.x=(p.x+p.vx+W)%W;p.y=(p.y+p.vy+H)%H;p.vx*=.99;p.vy*=.99}cx.fillStyle="#b9b2ff88";cx.beginPath();cx.arc(p.x,p.y,1.8,0,7);cx.fill()});
CF=CF.filter(c=>c.l-->0);CF.forEach(c=>{c.x+=c.vx;c.y+=c.vy;c.vy+=.4;cx.fillStyle=c.c;cx.fillRect(c.x,c.y,6,9)});requestAnimationFrame(loop)})();
go(0,false);
</script></body></html>
