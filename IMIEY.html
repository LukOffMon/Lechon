<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0d1f"><title>IMIEY</title>
<style>
:root{--bg:#0b0d1f;--fl:#161a3a;--wl:#3b2a7a;--wl2:#6d4cff;--ac:#00e5ff;--tx:#eaf0ff;--cd:#1a1f45;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:inherit;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;overscroll-behavior:none;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
body{position:relative;max-width:480px;margin:0 auto}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding:12px}
.hide{display:none!important}
.b{border:0;border-radius:16px;padding:12px 18px;font-weight:700;font-size:16px;font-family:inherit;color:var(--tx);background:var(--cd);box-shadow:0 4px 0 rgba(0,0,0,.35),0 0 0 2px var(--wl2) inset;transition:transform .08s,box-shadow .08s;cursor:pointer}
.b:active{transform:translateY(3px) scale(.95);box-shadow:0 1px 0 rgba(0,0,0,.35),0 0 0 2px var(--wl2) inset}
.b.p{background:var(--ac);color:var(--bg);box-shadow:0 4px 0 rgba(0,0,0,.35)}
.b:disabled{opacity:.4}
h1{font-size:64px;letter-spacing:6px;margin:7vh 0 0;background:linear-gradient(90deg,var(--ac),#ff5ac8,var(--ac));background-size:200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 3s linear infinite}
@keyframes sh{to{background-position:200% 0}}
.sub{opacity:.7;margin:4px 0}.deco{font-size:54px;margin:10px 0;letter-spacing:8px}
.mb{display:flex;flex-direction:column;gap:12px;width:80%;margin-top:16px}
.chip{background:rgba(255,255,255,.1);padding:6px 12px;border-radius:99px;font-weight:700}
.top{display:flex;justify-content:space-between;align-items:center;width:100%}.top .b{padding:8px 14px}
.hud{display:flex;gap:8px;width:100%;margin:8px 0}.hud div{flex:1;background:rgba(255,255,255,.07);border-radius:12px;padding:5px;text-align:center;font-size:12px}.hud b{display:block;font-size:20px}
.tip{background:var(--ac);color:var(--bg);border-radius:12px;padding:8px 12px;font-size:13px;font-weight:600;width:100%;text-align:center}
#stage{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;overflow:hidden}
canvas{border-radius:10px}
.bot{display:flex;align-items:center;justify-content:space-between;width:100%;padding-top:6px}
.bot>.b{width:84px;height:64px;font-size:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px}.bot small{font-size:10px}
.dp{display:grid;grid-template-columns:repeat(3,52px);grid-auto-rows:52px;gap:6px}.dp .b{padding:0;font-size:20px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;z-index:10;padding:16px}#modal.on{display:flex}
.box{background:var(--cd);border:2px solid var(--wl2);border-radius:22px;padding:18px;width:100%;max-width:420px;max-height:90%;overflow:auto;touch-action:pan-y;text-align:center;animation:pop .2s}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.box h2{margin:0 0 8px}.box p,.box li{font-size:15px;line-height:1.4}.box ul{text-align:left;padding-left:20px}.big{font-size:60px}
.gr{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:12px 0}.lv{padding:8px 0;display:flex;flex-direction:column;align-items:center}.lv small{font-size:10px;color:#ffd23f;min-height:12px}
.tabs{display:flex;gap:6px;justify-content:center;margin:10px 0}
.it{display:flex;align-items:center;gap:10px;padding:8px;border-radius:14px;background:rgba(255,255,255,.06);margin:6px 0}.pv{width:48px;height:48px;font-size:34px;display:flex;align-items:center;justify-content:center}.nm{flex:1;text-align:left;font-weight:600}.sw{display:block;width:40px;height:40px;border-radius:10px;border:2px solid}
.ok{color:var(--ac)}.st{font-size:34px;color:#ffd23f}
input{width:100%;padding:12px;border-radius:12px;border:2px solid var(--wl2);background:var(--bg);color:var(--tx);font-size:20px;text-align:center;margin:12px 0;user-select:text;-webkit-user-select:text;touch-action:auto}
#toast{position:fixed;left:50%;bottom:12%;transform:translateX(-50%);background:#000c;color:#fff;padding:10px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}#toast.on{opacity:1}
.cf{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden}.cf span{position:absolute;top:-40px;animation:fall 2.4s linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}

h:{n:'Temas de Color',ic:'🎨',it:[['neon','Modo Oscuro / Neón',0],['pastel','Pastel Soft',150],['gb','GameBoy Retro',250],['ocean','Ocean Deep',300],['gold','Cyberpunk Gold',400]]}};
const TH={
neon:{bg:'#0b0d1f',fl:'#161a3a',wl:'#3b2a7a',wl2:'#6d4cff',ac:'#00e5ff',tx:'#eaf0ff',cd:'#1a1f45'},
pastel:{bg:'#fdf2f8',fl:'#fff7ed',wl:'#c4b5fd',wl2:'#a78bfa',ac:'#f472b6',tx:'#4b3a5a',cd:'#ffffff'},
gb:{bg:'#0f380f',fl:'#8bac0f',wl:'#306230',wl2:'#0f380f',ac:'#9bbc0f',tx:'#e0f8d0',cd:'#306230'},
ocean:{bg:'#041e3a',fl:'#0b3a5e',wl:'#0e5a8a',wl2:'#1a8fc9',ac:'#3ee0cf',tx:'#e6f7ff',cd:'#08305a'},
gold:{bg:'#120f05',fl:'#221c0a',wl:'#4a3a10',wl2:'#c9a227',ac:'#ffd23f',tx:'#fff4cc',cd:'#2a2208'}};
const BX={wood:['#b9814a','#6b4423','x'],neon:['#0a0a1a','#00f0ff','n'],chest:['#8a4b1f','#ffd24a','l'],card:['#d7b07a','#9a7443','t'],gold:['#ffd700','#b8860b','g']};
const MSG={1:'👆 Desliza o usa la cruceta para moverte. Empuja la caja hasta el punto marcado y gana Chelines 🪙',2:'Solo puedes empujar UNA caja a la vez y nunca contra una pared. ¿Error? Usa ↩ Deshacer (hasta 10 movimientos).'};
function def(){return{coins:0,max:1,best:{},stars:{},bonus:{},own:{p:['worker'],b:['wood'],t:['red'],h:['neon']},eq:{p:'worker',b:'wood',t:'red',h:'neon'},code:false,tut:false}}
function load(){try{const d=JSON.parse(localStorage.getItem(SAVE));if(d)return{...def(),...d}}catch(e){}return def()}
function save(){try{localStorage.setItem(SAVE,JSON.stringify(S))}catch(e){}}
let S=load();if(S.code)S.max=LV.length;let lv=1,WL,TG,B,P,Wd,Hd,tile=30,moves=0,hist=[],won=false,tab='p';
const vib=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),1800)}
function modal(h){M.innerHTML='<div class="box">'+h+'</div>';M.classList.add('on')}
function close(){M.classList.remove('on')}
function confetti(){const f=document.createElement('div');f.className='cf';for(let i=0;i<26;i++){const s=document.createElement('span');s.textContent=['🎉','✨','🪙','⭐'][i%4];s.style.cssText=`left:${Math.random()*100}%;animation-delay:${Math.random()*.8}s;font-size:${18+Math.random()*16}px`;f.appendChild(s)}document.body.appendChild(f);setTimeout(()=>f.remove(),3500)}
function theme(){const T=TH[S.eq.h];for(const k in T)document.documentElement.style.setProperty('--'+k,T[k]);$('meta[name=theme-color]').content=T.bg}
function upd(){$('#mc').textContent=$('#gc').textContent='🪙 '+S.coins;$('#pl').textContent=S.max>1?`Continuar (Nivel ${Math.min(S.max,LV.length)})`:'Jugar'}
function show(s){$('#menu').classList.toggle('hide',s!='menu');$('#game').classList.toggle('hide',s!='game');upd()}
// ---------- dibujo ----------
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function box(c,x,y,s,id,on){const [f,e,m]=BX[id],p=s*.08,w=s-p*2;c.save();
if(m=='n'||on){c.shadowColor=on?'#4dff88':e;c.shadowBlur=s*.3}
rr(c,x+p,y+p,w,w,s*.12);c.fillStyle=f;c.fill();c.lineWidth=s*.07;c.strokeStyle=on?'#4dff88':e;c.stroke();
c.shadowBlur=0;c.strokeStyle=e;c.fillStyle=e;c.lineWidth=s*.06;c.beginPath();
if(m=='x'){c.moveTo(x+p*2,y+p*2);c.lineTo(x+s-p*2,y+s-p*2);c.moveTo(x+s-p*2,y+p*2);c.lineTo(x+p*2,y+s-p*2)}
else if(m=='l'){c.moveTo(x+p,y+s*.38);c.lineTo(x+s-p,y+s*.38);c.rect(x+s*.43,y+s*.33,s*.14,s*.18)}
else if(m=='t'){c.moveTo(x+s/2,y+p);c.lineTo(x+s/2,y+s*.5)}
else if(m=='g'){c.strokeStyle='#fff6b0';c.moveTo(x+s*.25,y+s*.3);c.lineTo(x+s*.45,y+s*.3);c.moveTo(x+s*.25,y+s*.42);c.lineTo(x+s*.35,y+s*.42)}
else{c.moveTo(x+p*2,y+s/2);c.lineTo(x+s-p*2,y+s/2);c.moveTo(x+s/2,y+p*2);c.lineTo(x+s/2,y+s-p*2)}
c.stroke();c.restore()}
function tgt(c,x,y,s,id){const cx=x+s/2,cy=y+s/2;c.save();c.lineWidth=s*.06;c.lineCap='round';
if(id=='red'){c.fillStyle='#ff3b3b';c.shadowColor='#f00';c.shadowBlur=s*.25;c.beginPath();c.arc(cx,cy,s*.17,0,7);c.fill()}
else if(id=='rune'){c.strokeStyle=c.fillStyle='#b388ff';c.shadowColor='#b388ff';c.shadowBlur=s*.3;c.beginPath();c.arc(cx,cy,s*.3,0,7);c.stroke();c.font=`${s*.4}px sans-serif`;c.textAlign='center';c.textBaseline='middle';c.fillText('✦',cx,cy)}
else if(id=='cross'){c.strokeStyle='#0ff';c.shadowColor='#0ff';c.shadowBlur=s*.25;c.beginPath();c.arc(cx,cy,s*.22,0,7);c.moveTo(cx-s*.38,cy);c.lineTo(cx-s*.1,cy);c.moveTo(cx+s*.1,cy);c.lineTo(cx+s*.38,cy);c.moveTo(cx,cy-s*.38);c.lineTo(cx,cy-s*.1);c.moveTo(cx,cy+s*.1);c.lineTo(cx,cy+s*.38);c.stroke()}
else{c.strokeStyle='#ffe14d';c.shadowColor='#ffb300';c.shadowBlur=s*.3;c.beginPath();c.arc(cx,cy,s*.32,0,7);c.stroke();c.beginPath();c.arc(cx,cy,s*.16,0,7);c.stroke()}
c.restore()}
const wall=(x,y)=>y<0||x<0||y>=Hd||x>=Wd||WL[y][x];
const near=(x,y)=>{for(let j=-1;j<=1;j++)for(let i=-1;i<=1;i++){const a=x+i,b=y+j;if(a>=0&&b>=0&&a<Wd&&b<Hd&&!WL[b][a])return 1}return 0};
function draw(){const T=TH[S.eq.h],c=ctx,s=tile;c.clearRect(0,0,Wd*s,Hd*s);
for(let y=0;y<Hd;y++)for(let x=0;x<Wd;x++){
if(WL[y][x]){if(!near(x,y))continue;rr(c,x*s+1,y*s+1,s-2,s-2,s*.18);c.fillStyle=T.wl;c.fill();c.strokeStyle=T.wl2;c.lineWidth=s*.07;c.stroke()}
else{c.fillStyle=T.fl;c.fillRect(x*s,y*s,s,s);c.strokeStyle='rgba(255,255,255,.06)';c.lineWidth=1;c.strokeRect(x*s,y*s,s,s);if(TG[y][x])tgt(c,x*s,y*s,s,S.eq.t)}}
B.forEach(([x,y])=>box(c,x*s,y*s,s,S.eq.b,TG[y][x]));
c.font=`${s*.72}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;c.textAlign='center';c.textBaseline='middle';c.fillText(PL[S.eq.p],P[0]*s+s/2,P[1]*s+s/2+s*.04)}
function fit(){const r=$('#stage').getBoundingClientRect();tile=Math.max(8,Math.floor(Math.min((r.width-4)/Wd,(r.height-4)/Hd)));const d=devicePixelRatio||1;cv.style.width=Wd*tile+'px';cv.style.height=Hd*tile+'px';cv.width=Wd*tile*d;cv.height=Hd*tile*d;ctx.setTransform(d,0,0,d,0,0);draw()}
// ---------- juego ----------
function start(n){lv=n;const L=LV[n-1],rows=L.m;Hd=rows.length;Wd=Math.max(...rows.map(r=>r.length));WL=[];TG=[];B=[];
rows.forEach((r,y)=>{WL[y]=[];TG[y]=[];for(let x=0;x<Wd;x++){const c=r[x]||' ';WL[y][x]=c=='#';TG[y][x]='.*+'.includes(c);if('$*'.includes(c))B.push([x,y]);if('@+'.includes(c))P=[x,y]}});
moves=0;hist=[];won=false;show('game');$('#ttl').textContent='Nivel '+n;$('#pr').textContent=L.p;$('#tip').classList.toggle('hide',!MSG[n]);$('#tip').textContent=MSG[n]||'';hud();fit()}
function hud(){$('#mv').textContent=moves;$('#bs').textContent=S.best[lv]||'–';$('#ub').innerHTML=`↩<small>Deshacer ${hist.length}/10</small>`}
function mv(dx,dy){if(won||M.classList.contains('on'))return;const nx=P[0]+dx,ny=P[1]+dy;if(wall(nx,ny))return;
const bi=B.findIndex(b=>b[0]==nx&&b[1]==ny);let push=0;
if(bi>=0){const x2=nx+dx,y2=ny+dy;if(wall(x2,y2)||B.some(b=>b[0]==x2&&b[1]==y2)){vib(5);return}
snap();B[bi]=[x2,y2];push=1}else snap();
P=[nx,ny];moves++;vib(push?22:8);draw();hud();if(B.every(b=>TG[b[1]][b[0]]))fin()}
function snap(){hist.push({P:[...P],B:B.map(b=>[...b]),m:moves});if(hist.length>10)hist.shift()}
function undo(){if(won||!hist.length)return;const h=hist.pop();P=h.P;B=h.B;moves=h.m;vib(10);draw();hud()}
function fin(){won=true;vib([40,40,80]);const par=LV[lv-1].p,st=moves<=par?3:moves<=Math.ceil(par*1.4)?2:1,bn=st==3?50:st==2?25:0;
let gain=S.stars[lv]?0:50;const ob=S.bonus[lv]||0;if(bn>ob){gain+=bn-ob;S.bonus[lv]=bn}
S.coins+=gain;S.best[lv]=Math.min(S.best[lv]||1e9,moves);S.stars[lv]=Math.max(S.stars[lv]||0,st);S.max=Math.max(S.max,Math.min(LV.length,lv+1));save();upd();hud();
setTimeout(()=>{confetti();modal(`<h2>¡Nivel Completado!</h2><div class="st">${'★'.repeat(st)}${'☆'.repeat(3-st)}</div><p>Movimientos: <b>${moves}</b> (par ${par})<br>Récord: <b>${S.best[lv]}</b></p><p class="ok"><b>+${gain} Chelines 🪙</b></p>`+(lv<LV.length?'<button class="b p" data-a="next">Siguiente ▶</button> ':'<p>🏆 ¡Has completado IMIEY!</p>')+'<button class="b" data-a="rep">Repetir</button> <button class="b" data-a="lvls">Niveles</button>')},380)}
// ---------- menús ----------
function help(){modal(`<h2>Cómo jugar</h2><ul><li>Desliza el dedo (o usa la cruceta / flechas) para mover al jugador.</li><li>Empuja las cajas 📦 hasta TODAS las casillas de destino.</li><li>Solo se empuja <b>una</b> caja a la vez; no atraviesan paredes.</li><li>↩ Deshacer revierte hasta 10 movimientos; ⟲ reinicia el nivel.</li><li>Gana 🪙 Chelines (50 base + bono por pocos movimientos) y personaliza tu juego en la Tienda.</li></ul><button class="b p" data-a="x">¡Entendido!</button>`)}
function lvls(){let h='<h2>Niveles</h2><div class="gr">';for(let i=1;i<=LV.length;i++){const u=i<=S.max,s=S.stars[i]||0;h+=`<button class="b lv" ${u?'':'disabled'} data-a="go" data-v="${i}">${u?i:'🔒'}<small>${u?'★'.repeat(s)+'☆'.repeat(3-s):''}</small></button>`}modal(h+'</div><button class="b" data-a="x">Cerrar</button>')}
function prev(k,id){if(k=='p')return PL[id];if(k=='h'){const t=TH[id];return `<i class="sw" style="background:linear-gradient(135deg,${t.bg} 50%,${t.ac} 50%);border-color:${t.wl2}"></i>`}
const c=document.createElement('canvas');c.width=c.height=56;const x=c.getContext('2d');x.fillStyle=TH[S.eq.h].fl;x.fillRect(0,0,56,56);k=='b'?box(x,0,0,56,id,0):tgt(x,0,0,56,id);return `<img src="${c.toDataURL()}" width="44" height="44" alt="">`}
function shop(){let h=`<h2>Tienda</h2><span class="chip">🪙 ${S.coins}</span><div class="tabs">`+Object.keys(SH).map(k=>`<button class="b ${k==tab?'p':''}" data-a="tab" data-v="${k}">${SH[k].ic}</button>`).join('')+`</div><h3>${SH[tab].n}</h3>`;
SH[tab].it.forEach(([id,nm,pr])=>{const own=S.own[tab].includes(id),eq=S.eq[tab]==id;h+=`<div class="it"><span class="pv">${prev(tab,id)}</span><span class="nm">${nm}</span>`+(eq?'<b class="ok">Equipado</b>':own?`<button class="b" data-a="eq" data-v="${id}">Equipar</button>`:`<button class="b p" data-a="buy" data-v="${id}">🪙 ${pr}</button>`)+'</div>'});
modal(h+'<button class="b" data-a="x">Cerrar</button>')}
function equip(id){S.eq[tab]=id;save();if(tab=='h')theme();shop()}
function buy(id){const pr=SH[tab].it.find(i=>i[0]==id)[2];if(S.coins<pr){toast('Chelines insuficientes 🪙');return}S.coins-=pr;S.own[tab].push(id);upd();equip(id)}
function codes(){modal('<h2>🔑 Códigos</h2><p>Introduce tu código secreto</p><input id="ci" inputmode="numeric" autocomplete="off" placeholder="Código"><button class="b p" data-a="redeem">Canjear</button> <button class="b" data-a="x">Cerrar</button>')}
function redeem(){const v=$('#ci').value.trim();if(v!=='080508'){toast('Código inválido');return}
if(S.code){toast('Este código ya fue canjeado ✔');return}
S.code=true;S.coins+=999999;S.max=LV.length;for(const k in SH)S.own[k]=SH[k].it.map(i=>i[0]);save();upd();
modal('<div class="big">🎉</div><h2>¡CÓDIGO SECRETO ACTIVADO!</h2><p>TODO EL CONTENIDO HA SIDO DESBLOQUEADO</p><p>+999,999 🪙 · '+LV.length+' niveles · todas las skins y temas</p><button class="b p" data-a="x">¡Genial!</button>');confetti()}
function act(a,v){switch(a){
case'play':start(Math.min(S.max,LV.length));break;case'lvls':lvls();break;case'shop':shop();break;case'code':codes();break;case'help':help();break;
case'menu':show('menu');break;case'x':close();break;case'go':close();start(+v);break;case'next':close();start(lv+1);break;case'rep':close();start(lv);break;
case'undo':undo();break;case'reset':start(lv);break;case'tab':tab=v;shop();break;case'eq':equip(v);break;case'buy':buy(v);break;case'redeem':redeem();break}}
// ---------- entrada ----------
document.addEventListener('click',e=>{const a=e.target.closest('[data-a]');if(a)act(a.dataset.a,a.dataset.v)});
document.addEventListener('pointerdown',e=>{const d=e.target.closest('[data-d]');if(d){e.preventDefault();const[x,y]=d.dataset.d.split(',').map(Number);mv(x,y)}});
let sx=null,sy=0;const stage=$('#stage');
stage.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY});
stage.addEventListener('pointermove',e=>{if(sx==null)return;const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<28)return;Math.abs(dx)>Math.abs(dy)?mv(Math.sign(dx),0):mv(0,Math.sign(dy));sx=e.clientX;sy=e.clientY});
['pointerup','pointercancel','pointerleave'].forEach(n=>stage.addEventListener(n,()=>sx=null));
addEventListener('keydown',e=>{if(M.classList.contains('on')||$('#game').classList.contains('hide'))return;
const k={ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]}[e.key];
if(k){e.preventDefault();mv(...k)}else if(e.key=='z')undo();else if(e.key=='r')start(lv)});
addEventListener('resize',()=>{if(!$('#game').classList.contains('hide'))fit()});
theme();show('menu');if(!S.tut){S.tut=true;save();help()}
</script></body></html>
