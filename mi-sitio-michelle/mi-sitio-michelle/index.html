<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8c9d8">
  <meta name="robots" content="noindex, nofollow">
  <title>Para Michelle</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Great+Vibes&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="backdrop" aria-hidden="true"></div>
  <canvas id="bubbles" aria-hidden="true"></canvas>

  <!-- 1. CUENTA REGRESIVA -->
  <main id="screen-1" class="screen active" data-screen="1">
    <div class="center-stack">
      <p class="script">Nuestra historia se desbloquea pronto...</p>
      <div class="countdown" role="timer" aria-live="off">
        <div class="unit glass"><span class="num" id="cd-days">00</span><span class="lbl">días</span></div>
        <div class="unit glass"><span class="num" id="cd-hours">00</span><span class="lbl">horas</span></div>
        <div class="unit glass"><span class="num" id="cd-mins">00</span><span class="lbl">minutos</span></div>
        <div class="unit glass"><span class="num" id="cd-secs">00</span><span class="lbl">segundos</span></div>
      </div>
      <p class="hint">1 de octubre de 2026</p>
    </div>
    <div class="bypass-glow" id="bypass-glow"></div>
    <div class="bypass-bar"><i id="bypass-fill"></i></div>
  </main>

  <!-- 2. PIN -->
  <section id="screen-2" class="screen" data-screen="2">
    <div class="center-stack">
      <h1 class="script big">¿En qué día nos hicimos el amor por primera vez, cariño?</h1>

      <div class="pin glass" id="pin-card">
        <div class="cal-head">
          <button class="icon-btn" id="cal-prev-y" aria-label="Año anterior">«</button>
          <button class="icon-btn" id="cal-prev-m" aria-label="Mes anterior">‹</button>
          <div class="cal-title" id="cal-title" aria-live="polite">octubre 2026</div>
          <button class="icon-btn" id="cal-next-m" aria-label="Mes siguiente">›</button>
          <button class="icon-btn" id="cal-next-y" aria-label="Año siguiente">»</button>
        </div>
        <div class="cal-week" aria-hidden="true"><span>L</span><span>M</span><span>M</span><span>J</span><span>V</span><span>S</span><span>D</span></div>
        <div class="cal-grid" id="cal-grid" role="grid"></div>
        <p class="pin-selected" id="pin-selected">Elige una fecha</p>
        <button class="btn" id="pin-confirm" disabled>Confirmar fecha</button>
        <p class="pin-msg" id="pin-msg" role="status"></p>
      </div>
    </div>
  </section>

  <!-- 3. LA CARTA -->
  <section id="screen-3" class="screen scroll" data-screen="3">
    <article class="letter" id="letter">
      <h2 class="script greeting" id="letter-greeting"></h2>
      <div id="letter-body"></div>
      <div class="letter-end" id="letter-end">
        <button class="btn glow" id="letter-final"></button>
      </div>
      <p class="tap-hint" id="tap-hint">Toca la pantalla, hay burbujas</p>
    </article>
  </section>

  <!-- 4. SALA DE MÚSICA Y RECUERDOS -->
  <section id="screen-4" class="screen" data-screen="4">
    <div class="room">
      <div class="fragment-wrap" aria-live="polite">
        <blockquote class="fragment glass" id="fragment">
          <p id="fragment-text">Dale play a una canción y te dejo un recuerdo.</p>
        </blockquote>
      </div>

      <div class="player glass">
        <div class="now">
          <div class="now-title" id="now-title">—</div>
          <div class="now-artist" id="now-artist"></div>
        </div>

        <div class="progress">
          <span class="time" id="t-cur">0:00</span>
          <input type="range" id="seek" min="0" max="1000" value="0" aria-label="Progreso de la canción">
          <span class="time" id="t-dur">0:00</span>
        </div>

        <div class="controls">
          <button class="icon-btn round" id="btn-prev" aria-label="Canción anterior">
            <svg viewBox="0 0 24 24" width="20" height="20"><path d="M6 5h2v14H6zM20 5v14L9 12z" fill="currentColor"/></svg>
          </button>
          <button class="icon-btn round main" id="btn-play" aria-label="Reproducir">
            <svg class="i-play" viewBox="0 0 24 24" width="26" height="26"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>
            <svg class="i-pause" viewBox="0 0 24 24" width="26" height="26"><path d="M7 5h4v14H7zM13 5h4v14h-4z" fill="currentColor"/></svg>
          </button>
          <button class="icon-btn round" id="btn-next" aria-label="Siguiente canción">
            <svg viewBox="0 0 24 24" width="20" height="20"><path d="M16 5h2v14h-2zM4 5v14l11-7z" fill="currentColor"/></svg>
          </button>
        </div>

        <button class="btn ghost" id="btn-memory">Otro recuerdo</button>

        <ul class="tracklist" id="tracklist"></ul>
      </div>
    </div>
  </section>

  <script src="data/data.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
